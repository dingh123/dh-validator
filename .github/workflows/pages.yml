name: Deploy Playground to Pages

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署进行
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install root deps (for src/ aliases)
        run: pnpm install --frozen-lockfile

      - name: Install playground deps
        run: pnpm --dir playground install --no-frozen-lockfile

      - name: Build playground
        env:
          # GitHub Pages 子路径：https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm --dir playground build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
